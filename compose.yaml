# Local development only. Not for staging or production.
#
# Start Postgres and Valkey:   docker compose up -d --wait
# Also run the app (optional): docker compose --profile web up -d --wait
#   (the app, a Celery worker, and beat; beat waits until migrate has run)
# Stop, keeping local data:    docker compose down
# Stop and delete local data:  docker compose down -v
#
# The database and cache URLs in .env.example point at these services
# without edits. This file holds no real data and no credentials.

services:
  db:
    # Same major version as new DigitalOcean managed Postgres clusters.
    image: postgres:18
    environment:
      # No password, matching the .env.example URL. Trust authentication is
      # safe only because the port is bound to localhost. The open role is a
      # superuser in this container, so the test runner can create test_open.
      POSTGRES_USER: open
      POSTGRES_DB: open
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker, so
      # the volume mounts at /var/lib/postgresql, not the older .../data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, so the temporary server the image runs during first-start
      # setup (socket only) does not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U open -d open"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cache:
    image: valkey/valkey:8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional. PgBouncer in transaction mode in front of db, on
  # 127.0.0.1:6432, like a DigitalOcean connection pool (ADR 0038). Start
  # it with docker compose --profile pgbouncer up -d --wait, then point
  # DATABASE_URL at it and DIRECT_DATABASE_URL at db (see .env.example).
  # Prepared statement support is off and the pool is small, so code that
  # keeps session state fails here first. Any database name is routed to
  # db, so the test databases are reachable too.
  pgbouncer:
    profiles: [pgbouncer]
    image: edoburu/pgbouncer:v1.24.1-p1
    configs:
      # The image writes its own config only when this file is missing.
      - source: pgbouncer-ini
        target: /etc/pgbouncer/pgbouncer.ini
    ports:
      - "127.0.0.1:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U open -d open"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  # Optional. Runs the app with uv, on http://127.0.0.1:8000, with the
  # Celery worker and beat services below. The container runs as root and
  # mounts the repository, so files it writes (a generated migration, for
  # example) are owned by root on the host. All three services use the
  # non-slim uv image, because uv needs git to install the engine from its
  # git tag.
  web:
    profiles: [web]
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    volumes:
      - .:/app
      # The container's virtualenv lives here, away from the host's .venv.
      - web-venv:/venv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # The settings read the mounted .env with the same parser as on the
      # host. These two win over it because they are in the process
      # environment, and they point at the services inside the network.
      DATABASE_URL: postgres://open@db:5432/open
      REDIS_URL: redis://cache:6379/0
    command: ["sh", "-c", "uv sync --locked && uv run python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "127.0.0.1:8000:8000"
    # Lets --wait return only once the server accepts connections. It opens
    # a socket rather than requesting a page, so a DEBUG-off https redirect
    # or an ALLOWED_HOSTS value without 127.0.0.1 cannot fail it. The first
    # start installs the dependencies, so it gets a long start period.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=4).close()"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # Optional. The Celery worker, consuming every queue. It shares web's
  # image and virtualenv, and starts once web is healthy, so web's
  # `uv sync --locked` has finished and --no-sync never races it.
  worker:
    profiles: [web]
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - web-venv:/venv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgres://open@db:5432/open
      REDIS_URL: redis://cache:6379/0
    command: uv run --no-sync celery -A config worker -Q ratings,email,webhooks,default -l info
    depends_on:
      web:
        condition: service_healthy

  # Optional. Celery beat, with the database scheduler from settings. The
  # scheduler reads django_celery_beat's tables, so beat waits, printing a
  # hint every few seconds, until `manage.py migrate` has been run (and the
  # database is reachable), then starts. Run one beat only, or periodic
  # tasks are sent twice.
  beat:
    profiles: [web]
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - web-venv:/venv
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgres://open@db:5432/open
      REDIS_URL: redis://cache:6379/0
    command:
      - sh
      - -c
      - |
        until uv run --no-sync python manage.py migrate --check >/dev/null 2>&1; do
          echo "beat: waiting for migrations. Run: uv run python manage.py migrate"
          sleep 5
        done
        exec uv run --no-sync celery -A config beat -l info
    depends_on:
      web:
        condition: service_healthy

configs:
  pgbouncer-ini:
    # Local only. auth_type any skips passwords, like db's trust
    # authentication, and every server connection logs in as open. The
    # port is bound to localhost.
    content: |
      [databases]
      * = host=db port=5432 user=open

      [pgbouncer]
      listen_addr = 0.0.0.0
      listen_port = 6432
      auth_type = any
      admin_users = open
      pool_mode = transaction
      max_prepared_statements = 0
      default_pool_size = 5
      max_client_conn = 200

volumes:
  postgres-data:
  valkey-data:
  web-venv:
