# DigitalOcean App Platform spec for OPEN's production backend (issue #61).
# README.md, "App Platform", explains how to deploy it and what is still
# set by hand. This file holds no secret values: DJANGO_SECRET_KEY,
# FIELD_ENCRYPTION_KEYS, RESEND_API_KEY, and ADMIN_URL are set in the App
# Platform console.
name: open-backend-production

# Set once here, so every component gets them (ADR 0038). Every one is
# RUN_TIME, so none reaches the PWA's static build.
envs:
  - key: DJANGO_DEBUG
    value: "false"
    scope: RUN_TIME
  - key: DJANGO_SECRET_KEY
    type: SECRET
    scope: RUN_TIME
  # Keys that encrypt personal data fields, newest first (ADR 0046).
  - key: FIELD_ENCRYPTION_KEYS
    type: SECRET
    scope: RUN_TIME
  # The two hosts Django answers on (#183, ADR 0063). Not ${APP_DOMAIN}:
  # that is only the primary domain. The app's ondigitalocean.app host
  # is left out on purpose. CSRF_TRUSTED_ORIGINS stays unset: every
  # first-party request is same-origin, and listing either host would let
  # it pass the origin check on the other (ADR 0063).
  - key: DJANGO_ALLOWED_HOSTS
    value: api.openpb.org,app.openpb.org
    scope: RUN_TIME
  # The pool open-pool, in transaction mode, which #68 creates.
  - key: DATABASE_URL
    value: ${pg.open-pool.DATABASE_URL}
    scope: RUN_TIME
  # The database itself, for migrate (ADR 0038).
  - key: DIRECT_DATABASE_URL
    value: ${pg.DATABASE_URL}
    scope: RUN_TIME
  - key: REDIS_URL
    value: ${valkey.DATABASE_URL}
    scope: RUN_TIME
  - key: FRONTEND_URL
    # The web app's production origin (#182).
    value: https://app.openpb.org
    scope: RUN_TIME
  - key: EMAIL_BACKEND
    value: anymail.backends.resend.EmailBackend
    scope: RUN_TIME
  - key: RESEND_API_KEY
    type: SECRET
    scope: RUN_TIME
  - key: DEFAULT_FROM_EMAIL
    value: OPEN <noreply@mail.openpb.org>
    scope: RUN_TIME
  # The admin's private path (#101), kept out of this public file.
  - key: ADMIN_URL
    type: SECRET
    scope: RUN_TIME

# api.openpb.org is the partners' API host; app.openpb.org is the PWA's
# host, where Django answers only the paths below (ADR 0061, ADR 0063).
# DNS for both is a CNAME to the app's ondigitalocean.app host, kept
# unproxied, at the openpb.org DNS provider (README, "Domains").
domains:
  - domain: api.openpb.org
    type: PRIMARY
    minimum_tls_version: "1.2"
  - domain: app.openpb.org
    type: ALIAS
    minimum_tls_version: "1.2"

# Every rule names its host. App Platform does not document the order it
# tries rules in, so on each host the longer prefixes come first: first
# match and longest prefix then give the same result. preserve_path_prefix
# keeps /api/ and the others in the path Django sees. Every other path on
# app.openpb.org goes to the PWA's static site (#304); the admin is on
# api.openpb.org only (ADR 0063).
ingress:
  rules:
    - match:
        authority:
          exact: app.openpb.org
        path:
          prefix: /api/
      component:
        name: web
        preserve_path_prefix: true
    - match:
        authority:
          exact: app.openpb.org
        path:
          prefix: /_allauth/
      component:
        name: web
        preserve_path_prefix: true
    - match:
        authority:
          exact: app.openpb.org
        path:
          prefix: /oauth/
      component:
        name: web
        preserve_path_prefix: true
    - match:
        authority:
          exact: app.openpb.org
        path:
          prefix: /
      component:
        name: app
        preserve_path_prefix: true
    - match:
        authority:
          exact: api.openpb.org
        path:
          prefix: /
      component:
        name: web
        preserve_path_prefix: true

# Every service, worker, and job runs the same image. The tag is a
# placeholder: #63 deploys by digest instead.
services:
  - name: web
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    # The image's command, gunicorn. App Platform sets PORT to http_port.
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # Stops traffic while the database or cache is down.
    health_check:
      http_path: /api/v1/health/ready
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 8
      success_threshold: 1
      failure_threshold: 3
    # Restarts the container only when the process stops answering.
    liveness_health_check:
      http_path: /api/v1/health/live
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6

workers:
  - name: worker
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: celery -A config worker -Q ratings,email,webhooks,default -l info --concurrency 2
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
  # Exactly one beat, or periodic tasks are sent twice.
  - name: beat
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  # Runs before each deploy goes live. OPEN's migrate uses
  # DIRECT_DATABASE_URL by itself, so it takes no --database (ADR 0038).
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: python manage.py migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

# The PWA (openpickleball/frontend, app/), built to static files (#304).
# A git source, not github: the repository is public, so App Platform
# needs no access to the organization, and a git source never deploys on
# push. A frontend merge alone never redeploys web, worker, and beat or
# runs migrate; the PWA goes live with a deploy of this app. The other
# way round, every deploy of this app builds frontend main at its head:
# it ships whatever main holds, and a main that fails its build fails the
# whole deploy, a backend-only change or secret change included.
# Static sites cannot set response headers, so Cache-Control for
# index.html, service-worker.js, and the manifest, and framing
# protection, cannot be set here (frontend app/README.md, "What App
# Platform cannot do").
static_sites:
  - name: app
    git:
      repo_clone_url: https://github.com/openpickleball/frontend.git
      branch: main
    source_dir: app
    environment_slug: node-js
    # Fails the deploy if the build ships mock code or a broken content
    # security policy.
    build_command: pnpm build && pnpm check:build
    output_dir: build
    # Every path without a file gets the shell, for client-side routes.
    catchall_document: index.html
    envs:
      - key: PUBLIC_API_MOCK
        value: "off"
        scope: BUILD_TIME
      # The commit the Profile page shows (#349). The frontend ignores a
      # value that is not a 7 to 40 character hex hash.
      - key: APP_COMMIT
        value: ${_self.COMMIT_HASH}
        scope: BUILD_TIME

databases:
  - name: pg
    engine: PG
    production: true
    cluster_name: open-production-pg
    db_name: open
    db_user: open
  # Cache and Celery broker (ADR 0006). TLS only.
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: open-production-valkey
