# DigitalOcean App Platform spec for OPEN's production backend (issue #61).
# README.md, "App Platform", explains how to deploy it and what is still
# set by hand. This file holds no secret values: DJANGO_SECRET_KEY and
# RESEND_API_KEY are set in the App Platform console.
name: open-backend-production

# Set once here, so every component gets them (ADR 0038).
envs:
  - key: DJANGO_DEBUG
    value: "false"
    scope: RUN_TIME
  - key: DJANGO_SECRET_KEY
    type: SECRET
    scope: RUN_TIME
  - key: DJANGO_ALLOWED_HOSTS
    value: ${APP_DOMAIN}
    scope: RUN_TIME
  # The pool open-pool, in transaction mode, which #62 creates.
  - key: DATABASE_URL
    value: ${pg.open-pool.DATABASE_URL}
    scope: RUN_TIME
  # The database itself, for migrate (ADR 0038).
  - key: DIRECT_DATABASE_URL
    value: ${pg.DATABASE_URL}
    scope: RUN_TIME
  - key: REDIS_URL
    value: ${valkey.DATABASE_URL}
    scope: RUN_TIME
  - key: FRONTEND_URL
    # The web app's production origin (#182).
    value: https://app.openpb.org
    scope: RUN_TIME
  - key: EMAIL_BACKEND
    value: anymail.backends.resend.EmailBackend
    scope: RUN_TIME
  - key: RESEND_API_KEY
    type: SECRET
    scope: RUN_TIME
  - key: DEFAULT_FROM_EMAIL
    value: OPEN <noreply@mail.openpb.org>
    scope: RUN_TIME

# Every component runs the same image. The tag is a placeholder: #63
# deploys by digest instead.
services:
  - name: web
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    # The image's command, gunicorn. App Platform sets PORT to http_port.
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # Stops traffic while the database or cache is down.
    health_check:
      http_path: /api/v1/health/ready
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 8
      success_threshold: 1
      failure_threshold: 3
    # Restarts the container only when the process stops answering.
    liveness_health_check:
      http_path: /api/v1/health/live
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 6

workers:
  - name: worker
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: celery -A config worker -Q ratings,email,webhooks,default -l info --concurrency 2
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
  # Exactly one beat, or periodic tasks are sent twice.
  - name: beat
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

jobs:
  # Runs before each deploy goes live. OPEN's migrate uses
  # DIRECT_DATABASE_URL by itself, so it takes no --database (ADR 0038).
  - name: migrate
    kind: PRE_DEPLOY
    image:
      registry_type: GHCR
      registry: openpickleball
      repository: backend
      tag: main
    run_command: python manage.py migrate
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

databases:
  - name: pg
    engine: PG
    production: true
    cluster_name: open-production-pg
    db_name: open
    db_user: open
  # Cache and Celery broker (ADR 0006). TLS only.
  - name: valkey
    engine: VALKEY
    production: true
    cluster_name: open-production-valkey
