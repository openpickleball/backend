[project]
name = "open-backend"
version = "0.1.0"
description = "Backend services and APIs for OPEN, the Open Pickleball Evaluation Network."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "django-stubs-ext>=6.1.2",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "factory-boy>=3.3.3",
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
target-version = "py313"
# Migrations are generated. Markdown is excluded because ruff formats
# fenced Python blocks in it, which the pre-commit hook (Python files only)
# would not check, and the docs/plans records must not change.
extend-exclude = ["**/migrations/**", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "RUF"]
# The formatter owns line length; the remaining hits are long strings.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The email normalization tests use look-alike characters on purpose.
"**/tests/**" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
# Skip ignored directories such as .venv and .claude/worktrees.
exclude_gitignore = true

[[tool.mypy.overrides]]
# django-environ ships no type information.
module = ["environ", "environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Its scalar body parameters use the `name: str = Body(...)` form, which
# ninja's type-checking stubs see as a bare generic.
module = ["config.tests.test_api_body_field_paths"]
disallow_any_generics = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
# Only test_*.py, so config/settings_test.py is never collected.
python_files = ["test_*.py"]
testpaths = ["apps", "config"]
# A plain `pytest` reports coverage and enforces fail_under. --cov takes an
# optional value, so an option follows it; otherwise it would swallow a test
# path given on the command line as a coverage source.
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["apps", "config"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
