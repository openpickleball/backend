# Weekly update pull requests, with minor and patch updates grouped.
# Major updates come one per pull request. Security updates (Dependabot
# alerts) are separate and come as soon as an advisory is published.
version: 2
updates:
  # uv.lock and pyproject.toml.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new engine release can need a full replay, so it is upgraded by
      # hand (docs/engine.md).
      - dependency-name: openpickleball-engine

  # The actions in .github/workflows, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The base images in the Dockerfile, pinned by tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      # Both Python stages use the same digest, so they move together.
      base-images:
        patterns: ["*"]
    ignore:
      # The Python minor must match .python-version, so only the digest
      # of the current tag is updated. Change the minor by hand.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
