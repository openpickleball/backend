name: Task
description: Plan a piece of backend work with clear acceptance criteria.
labels: ["triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this work is needed. Link the epic, decisions, or issues it builds on.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: The steps to finish this work.
      placeholder: |
        - [ ] First step
        - [ ] Second step
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Checkable statements that are true when this work is done.
      placeholder: |
        - [ ] An organizer can...
        - [ ] Tests cover...
    validations:
      required: true
  - type: textarea
    id: depends-on
    attributes:
      label: Depends on
      description: List the issue numbers that must land first.
    validations:
      required: false
  - type: dropdown
    id: size
    attributes:
      label: Size
      description: A rough estimate. S is under a day, M is a few days, L is a week or more.
      options:
        - S
        - M
        - L
    validations:
      required: false
  - type: checkboxes
    id: agreements
    attributes:
      label: Before you submit
      options:
        - label: This task fits the [mission charter](https://github.com/openpickleball/.github/blob/main/CHARTER.md), which rules out subscriptions, paid tiers, advertisements, and premium features.
          required: true
        - label: This task does not contain real player names, contact details, or match histories.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/openpickleball/.github/blob/main/CODE_OF_CONDUCT.md).
          required: true
