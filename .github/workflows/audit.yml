name: Audit

# Checks the locked dependencies for known vulnerabilities
# (scripts/audit_dependencies.py). The weekly run catches advisories
# published after a dependency was locked.
# No paths filter: a required check that is skipped blocks the pull request.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Fails when uv.lock is out of step with pyproject.toml.
      - run: uv sync --locked
      - run: uv run python scripts/audit_dependencies.py
