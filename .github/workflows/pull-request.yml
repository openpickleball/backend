name: Pull request

# Checks the commit messages and the description (scripts/check_pull_request.py).
# `edited` reruns it when the title or description changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

# The job name is meant to be a required status check on main, so a
# change that renames it must also update the main ruleset.
jobs:
  pull-request:
    name: pull-request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the commit messages and the description
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" > "$RUNNER_TEMP/commits.json"
          python3 -I scripts/check_pull_request.py pr "$RUNNER_TEMP/commits.json"
